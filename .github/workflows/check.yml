name: Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  documents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild presentation source
        run: python review/build.py
      - name: Check committed presentation matches its source
        run: git diff --exit-code -- review/board-meeting.html review/MEETING-NOTES.md
      - name: Check review package
        run: python review/check.py

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --locked --python 3.12
      - name: Import the worker (plugins and tools register)
        run: uv run python -c "import open_tutor.agent, open_tutor.web"
      - name: Tests
        run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
