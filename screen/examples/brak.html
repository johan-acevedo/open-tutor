<h1>Vilket är störst: $\frac{3}{4}$ eller $\frac{2}{3}$?</h1>
<div class="card">
  <ot-fraction id="fjardedelar" value="3/4"></ot-fraction>
  <ot-fraction id="tredjedelar" value="2/3" color="violet"></ot-fraction>
</div>
<div class="card">
  <h2>Dela båda i tolftedelar</h2>
  <ot-numberline id="tallinje" from="0" to="1" step="1/12">
    <ot-mark id="m-tre" at="3/4">$\frac{3}{4}$</ot-mark>
    <ot-mark id="m-tva" at="2/3" color="violet">$\frac{2}{3}$</ot-mark>
  </ot-numberline>
</div>
<p class="big">Svar: <ot-hidden id="svar">$\frac{3}{4} = \frac{9}{12}$ är större än $\frac{2}{3} = \frac{8}{12}$</ot-hidden></p>
