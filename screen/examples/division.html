<h1>Pris per kilo</h1>
<div class="row">
  <div class="stack">
    <div class="paper">
      <p class="muted">Uppgift 4</p>
      <p>5 kg äpplen kostar 47,50 kr. Vad kostar 1 kg?</p>
    </div>
    <div class="card">
      <h2>Så tänker vi</h2>
      <p>pris per kilo = pris ÷ antal kilo</p>
      <p class="big">$47,50 \div 5$</p>
    </div>
    <ot-answer id="svar" label="1 kg kostar" unit="kr"></ot-answer>
  </div>
  <div class="card center">
    <h2>Liggande stolen</h2>
    <ot-written id="stolen" op="÷" a="47,50" b="5" steps="1"></ot-written>
    <p id="forklaring" class="muted">5 går 9 gånger i 47. Det blir 2 över.</p>
  </div>
</div>
