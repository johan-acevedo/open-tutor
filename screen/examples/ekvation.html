<h1>Lös ekvationen $3x + 5 = 20$</h1>
<div class="row">
  <div class="card">
    <h2>Vågen väger lika på båda sidor</h2>
    <ot-balance id="vag" left="3x + 5" right="20"></ot-balance>
    <p class="muted">Det du gör på ena sidan gör du på den andra.</p>
  </div>
  <div class="stack">
    <ot-steps id="steg">
      <ot-step>$3x + 5 = 20$</ot-step>
      <ot-step note="−5 på båda sidor">$3x = 15$</ot-step>
      <ot-step note="÷3 på båda sidor" later>$x = 5$</ot-step>
    </ot-steps>
    <ot-answer id="svar" label="$x =$"></ot-answer>
  </div>
</div>
