<h1>Vad är klockan?</h1>
<div class="row">
  <ot-clock id="klocka" time="7:45" minutes></ot-clock>
  <div class="stack">
    <div class="card">
      <p><b>Lilla visaren</b> visar timmen. Den har nästan kommit fram till <b>8</b>.</p>
      <p><b class="cyan">Stora visaren</b> visar minuterna. Den pekar på <b class="cyan">9</b>. Det är <b class="cyan">45 minuter</b>.</p>
    </div>
    <h2>Vilket är rätt?</h2>
    <ot-choice id="val" class="column">
      <button>kvart över sju</button>
      <button correct>kvart i åtta</button>
      <button>halv åtta</button>
    </ot-choice>
  </div>
</div>
