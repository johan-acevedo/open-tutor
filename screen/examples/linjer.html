<h1>Räta linjen $y = 2x + 1$</h1>
<div class="row">
  <ot-graph id="graf" x="-3 5" y="-2 9" class="wide">
    <ot-fn id="linje" label="$y = 2x + 1$">2x + 1</ot-fn>
    <ot-polygon id="trappa" points="1 3, 2 3, 2 5" sides="1 | 2 |" color="amber" fill="none"></ot-polygon>
    <ot-point id="skarning" x="0" y="1" label-pos="w">$(0, 1)$</ot-point>
  </ot-graph>
  <div class="stack">
    <div class="card">
      <h2>$k$ = lutningen</h2>
      <p>Ett steg åt höger, två steg upp.</p>
      <p class="big">$k = \frac{2}{1} = 2$</p>
    </div>
    <div class="card">
      <h2>$m$ = där linjen skär $y$-axeln</h2>
      <p class="big">$m = 1$</p>
    </div>
    <p class="tip">$y = kx + m$</p>
  </div>
</div>
