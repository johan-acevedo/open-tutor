<h1>Cirkelns radie</h1>
<ot-graph id="cirkel" x="-5 5" y="-5 5" axes="off">
  <ot-fn domain="-4 4">sqrt(16 - x^2)</ot-fn>
  <ot-fn domain="-4 4">-sqrt(16 - x^2)</ot-fn>
  <ot-point id="medelpunkt" x="0" y="0" label-pos="s">Medelpunkt</ot-point>
  <ot-segment id="radie" from="0 0" to="4 0" color="cyan">4 cm</ot-segment>
</ot-graph>
<p><b>Radien</b> är sträckan från medelpunkten ut till cirkelns kant.</p>
