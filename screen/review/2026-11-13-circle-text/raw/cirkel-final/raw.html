<h1>Cirkel med radie</h1>
<ot-graph id="graf" x="-5 5" y="-5 5" axes="off">
  <ot-fn id="ovre" color="cyan" domain="-4 4">sqrt(16-x^2)</ot-fn>
  <ot-fn id="nedre" color="cyan" domain="-4 4">-sqrt(16-x^2)</ot-fn>
  <ot-point id="medelpunkt" x="0" y="0"></ot-point>
  <ot-segment id="radie" from="0 0" to="4 0">4 cm</ot-segment>
</ot-graph>
<p class="tip"><b>Radie</b> är avståndet från medelpunkten ut till kanten.</p>
