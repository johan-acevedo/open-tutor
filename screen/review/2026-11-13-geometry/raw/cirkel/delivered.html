<h1>Cirkelns radie</h1>
<ot-graph id="graf" x="-5 5" y="-5 5" axes="off">
  <ot-fn id="cirkel-ovre" domain="-4 4" color="cyan">sqrt(16 - x^2)</ot-fn>
  <ot-fn id="cirkel-undre" domain="-4 4" color="cyan">-sqrt(16 - x^2)</ot-fn>
  <ot-point id="medelpunkt" x="0" y="0" label-pos="sw">Medelpunkt</ot-point>
  <ot-segment id="radie" from="0 0" to="4 0" color="amber">4 cm</ot-segment>
</ot-graph>
<p class="tip"><b>Radie</b> är sträckan från medelpunkten ut till kanten.</p>
