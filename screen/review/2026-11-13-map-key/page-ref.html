<h1>Sveriges 21 län</h1>
<p>Sverige är delat i <b>21 län</b>. Varje län har en <b>bokstavskod</b>. Nyckeln visar vilken kod som hör till vilket län.</p>
<ot-map id="karta" view="sverige" regions="län"></ot-map>
<div class="row">
  <div class="card cyan wide">
    <p>Leta upp <b>Skåne</b> längst i söder och <b>Norrbotten</b> längst i norr.</p>
  </div>
  <div class="stack">
    <h2>Vilken kod har Skåne?</h2>
    <ot-choice id="val">
      <button>M</button>
      <button>BD</button>
      <button>AB</button>
      <button>O</button>
    </ot-choice>
  </div>
</div>
