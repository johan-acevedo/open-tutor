<h1>$\frac{3}{4} + \frac{1}{8}$</h1>
<div class="row">
  <div class="card">
    <h2>Dela i åttondelar</h2>
    <ot-fraction id="tre-fjardedelar" value="3/4"></ot-fraction>
    <ot-fraction id="sex-attondelar" value="6/8" color="cyan"></ot-fraction>
    <ot-fraction id="en-attondel" value="1/8" color="violet"></ot-fraction>
    <p class="small muted">$\frac{3}{4}$ är samma sak som $\frac{6}{8}$.</p>
  </div>
  <div class="stack">
    <ot-steps id="steg">
      <ot-step>$\frac{3}{4} + \frac{1}{8}$</ot-step>
      <ot-step note="förläng $\frac{3}{4}$ med 2">$\frac{6}{8} + \frac{1}{8}$</ot-step>
      <ot-step note="7 åttondelar" result later>$\frac{7}{8}$</ot-step>
    </ot-steps>
    <p class="tip">Samma nämnare först – sedan lägger du ihop täljarna.</p>
  </div>
</div>
<div class="card green">
  <h2>Prova själv</h2>
  <p class="big">$\frac{1}{2} + \frac{1}{6} =$</p>
  <ot-answer id="svar" label="Svar" kind="text"></ot-answer>
</div>
