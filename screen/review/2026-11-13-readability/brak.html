<h1>Gör om till åttondelar</h1>
<div class="row">
  <div class="card">
    <h2>Hur många åttondelar är $\frac{3}{4}$?</h2>
    <ot-fraction id="tre-fjardedelar" value="3/4" color="cyan"></ot-fraction>
    <ot-fraction id="sex-attondelar" value="6/8"></ot-fraction>
    <p class="big">$\frac{3}{4} = \frac{6}{8}$</p>
  </div>
  <div class="stack">
    <ot-numberline id="tallinje" from="0" to="1" step="1/8">
      <ot-mark id="mark" at="3/4" color="cyan">$\frac{3}{4}$</ot-mark>
    </ot-numberline>
    <p class="tip">Båda bråken måste ha samma nämnare innan du lägger ihop dem.</p>
    <ot-answer id="svar" label="$\frac{3}{4} + \frac{1}{8} =$"></ot-answer>
  </div>
</div>
