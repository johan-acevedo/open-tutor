<ot-patch target="tallinje" do="append"><ot-mark id="mark-summa" at="7/8" color="amber">$\frac{7}{8}$</ot-mark></ot-patch>
<ot-patch target="svar" do="after">
  <div class="card">
    <h2>Så räknar vi</h2>
    <ot-steps id="summa">
      <ot-step>$\frac{3}{4} + \frac{1}{8}$</ot-step>
      <ot-step note="först till åttondelar">$\frac{6}{8} + \frac{1}{8}$</ot-step>
      <ot-step note="nämnaren 8 är kvar">$\frac{6+1}{8}$</ot-step>
      <ot-step result>$\frac{7}{8}$</ot-step>
    </ot-steps>
  </div>
</ot-patch>
