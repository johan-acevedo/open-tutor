<h1>Räta linjen $y = 2x + 3$</h1>
<div class="row">
  <ot-graph id="graf" x="-3 5" y="-2 9" class="wide">
    <ot-fn id="linje" label="$y = 2x + 3$">2x + 3</ot-fn>
    <ot-point id="skarning" x="0" y="3" label-pos="w">$(0, 3)$</ot-point>
  </ot-graph>
  <div class="stack">
    <div class="card">
      <h2>$k$ = lutningen</h2>
      <p>Gå <b>1</b> steg åt höger, sedan <b class="cyan">2</b> steg upp. Linjen lutar alltså 2 upp per 1 höger.</p>
      <p class="big">$k = \frac{2}{1} = 2$</p>
    </div>
    <div class="card green">
      <h2>Fråga</h2>
      <p>Om $x$ ökar med 1, hur mycket ökar $y$ då?</p>
      <ot-answer id="svar" label="y ökar med"></ot-answer>
    </div>
    <p class="tip">$y = kx + m$</p>
  </div>
</div>
