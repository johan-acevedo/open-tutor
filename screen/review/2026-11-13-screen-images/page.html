<h1>Colosseum i Rom</h1>
<ot-image id="colosseum" alt="Colosseum i Rom" src="https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d8/Colosseum_in_Rome-April_2007-1-_copie_2B.jpg/960px-Colosseum_in_Rome-April_2007-1-_copie_2B.jpg?utm_source=commons.wikimedia.org&amp;utm_campaign=imageinfo&amp;utm_content=thumbnail" credit="Bild: Diliff, CC BY-SA 2.5, Wikimedia Commons"></ot-image>
<p>Colosseum är en gigantisk amfiteater i Rom som byggdes för nästan 2 000 år sedan. Här fick upp till <b>50 000 åskådare</b> plats för att se gladiatorer slåss och andra stora skådespel.</p>
