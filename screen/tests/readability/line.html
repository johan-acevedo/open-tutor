<h1>Räta linjen $y = 2x + 3$</h1>
<div class="row">
  <ot-graph id="graf" x="-4 4" y="-3 9" class="wide">
    <ot-fn id="linje" label="$y = 2x + 3$">2x + 3</ot-fn>
  </ot-graph>
  <div class="stack">
    <div class="card">
      <h2>Vad betyder talen?</h2>
      <p>Talet framför $x$ kallas <b class="cyan">$k$</b>.</p>
      <p>Talet som står ensamt kallas <b class="violet">$m$</b>.</p>
    </div>
    <p class="tip">Titta på grafen: hur mycket stiger linjen när du går ett steg åt höger? Var skär linjen $y$-axeln?</p>
    <div class="card">
      <ot-answer id="svar-k" label="$k =$"></ot-answer>
      <ot-answer id="svar-m" label="$m =$"></ot-answer>
    </div>
  </div>
</div>
