<h1>Pythagoras sats</h1>
<div class="row">
  <ot-graph id="triangel" axes="off">
    <ot-polygon points="0 0, 4 0, 4 3" vertices="A B C" sides="4 cm | 3 cm | $c$"></ot-polygon>
  </ot-graph>
  <div class="stack">
    <ot-steps id="p">
      <ot-step>$c^2 = a^2 + b^2$</ot-step>
      <ot-step>$c^2 = 4^2 + 3^2$</ot-step>
      <ot-step note="räkna">$c^2 = 25$</ot-step>
      <ot-step note="roten ur" result>$c = 5$</ot-step>
    </ot-steps>
    <div class="row keep">
      <ot-written op="+" a="378" b="456"></ot-written>
      <ot-written op="−" a="403" b="167"></ot-written>
      <ot-written op="×" a="2,4" b="7"></ot-written>
    </div>
  </div>
</div>
