[project]
name = "open-tutor"
version = "0.1.0"
description = "Live Swedish voice tutor: LiveKit agent worker and small web service"
requires-python = ">=3.11,<3.14"
dependencies = [
  "livekit-agents~=1.8.10",
  "livekit-plugins-soniox~=1.8.10",
  "livekit-plugins-elevenlabs~=1.8.10",
  "livekit-plugins-cartesia~=1.8.10",
  "livekit-plugins-openai~=1.8.10",
  "livekit-plugins-silero~=1.8.10",
  "livekit-api>=1.2,<2",
  "fastapi>=0.160,<0.170",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.10,<3",
  "aiohttp>=3.10,<4",
  "livekit-plugins-deepgram~=1.8.10",
  "playwright>=1.55,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=1,<2",
    "httpx>=0.28,<1",
    "playwright>=1.65.1",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["open_tutor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "../screen/tests"]
pythonpath = ["."]
